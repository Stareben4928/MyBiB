ent, 27 pour le Nouveau), composés sur environ mille ans, en plusieurs langues, par des auteurs différents."]},{h:"Ancien et Nouveau Testament",p:["« Testament » traduit l’hébreu berith et le grec diathêkê : l’alliance. L’Ancien Testament correspond, avec quelques livres en plus, à la Bible hébraïque (le Tanakh : Torah, Nevi’im — les Prophètes, Ketouvim — les Écrits).","Le Nouveau Testament rassemble les quatre Évangiles, les Actes des Apôtres, les lettres et l’Apocalypse."]},{h:"Qu’est-ce qu’un canon ?",p:["Canon vient du grec kanôn, « règle » : c’est la liste des livres reconnus comme inspirés. Le canon catholique inclut sept livres dits deutérocanoniques (Tobie, Judith, 1 et 2 Maccabées, Sagesse, Ben Sira le Sage et Baruch) ainsi que des compléments grecs à Esther et à Daniel. Les Églises issues de la Réforme ne les retiennent pas dans leur canon (66 livres au total).","Les listes du Nouveau Testament se stabilisent aux IVe–Ve siècles (lettre pascale d’Athanase en 367, synodes d’Hippone en 393 et de Carthage en 397). Le concile de Trente a défini solennellement le canon catholique en 1546."]}],keyPoints:["Bible = « les livres » : 46 + 27 = 73 livres (catholique).","Testament = alliance (berith / diathêkê).","Canon = règle, liste des livres inspirés ; 7 livres deutérocanoniques.","Trente (1546) : définition solennelle du canon catholique."],questions:[{q:"Combien de livres compte la Bible catholique ?",options:["66","73","72","81"],answer:1,explain:"46 livres pour l’Ancien Testament et 27 pour le Nouveau : 73. Le chiffre 66 correspond au canon protestant."},{q:"Que signifie le mot grec kanôn ?",options:["Livre","Parole","Règle","Alliance"],answer:2,explain:"Kanôn désigne une règle, une mesure ; d’où la « liste normative » des livres inspirés."},{q:"Quel concile a défini solennellement le canon catholique en 1546 ?",options:["Nicée","Chalcédoine","Trente","Vatican II"],answer:2,explain:"Le concile de Trente (1546) a précisé la liste des livres sacrés reçus par l’Église catholique."}],reflection:"Quelle place la Bible occupe-t-elle aujourd’hui dans ma vie de prière et d’étude ? Qu’est-ce que je souhaite le plus découvrir ?"},{id:"langues",level:1,title:"Les langues et les traductions",minutes:8,objectives:["Nommer les trois langues de la Bible","Situer la Septante et la Vulgate","Comprendre pourquoi consulter l’original"],sections:[{h:"Trois langues",p:["L’Ancien Testament est écrit surtout en hébreu. Quelques passages sont en araméen (par exemple Daniel 2,4b–7,28 et une partie d’Esdras), langue aussi parlée par Jésus. Le Nouveau Testament est écrit en grec koinè, le grec commun de l’époque hellénistique, ainsi que plusieurs livres tardifs de l’Ancien Testament (Sagesse, 2 Maccabées)."]},{h:"Les grandes traductions anciennes",p:["La Septante (LXX) est la traduction grecque de la Bible hébraïque, commencée à Alexandrie au IIIe siècle av. J.-C. Les auteurs du Nouveau Testament la citent très souvent.","La Vulgate est la traduction latine de saint Jérôme (fin du IVe siècle), longtemps le texte de référence de l’Église latine."]},{h:"Les traductions françaises",p:["La Bible Segond (protestante, XIXe siècle), la Bible de Jérusalem (École biblique de Jérusalem, 1956), la Traduction œcuménique de la Bible (TOB, années 1970) et la traduction liturgique officielle (AELF) utilisée à la messe. Chacune fait des choix de traduction et donc d’interprétation."]},{h:"Pourquoi regarder l’original ?",p:["Une traduction est déjà une interprétation : un mot hébreu comme hesed peut être rendu par « amour », « fidélité », « bonté » ou « miséricorde ». Revenir au mot original, à sa racine et à ses autres emplois permet de mesurer ce que la traduction choisit de dire. C’est le travail de l’atelier « Langues anciennes »."]}],keyPoints:["Hébreu (AT), araméen (quelques passages), grec koinè (NT).","Septante = traduction grecque de l’AT (Alexandrie, IIIe–IIe s. av. J.-C.).","Vulgate = traduction latine de Jérôme.","Toute traduction est une interprétation."],questions:[{q:"Dans quelle langue le Nouveau Testament a-t-il été écrit ?",options:["Hébreu","Araméen","Latin","Grec koinè"],answer:3,explain:"Le Nouveau Testament est rédigé en grec koinè, langue commune du monde méditerranéen."},{q:"Qu’est-ce que la Septante ?",options:["Une traduction grecque de la Bible hébraïque","Une traduction latine du Nouveau Testament","Un commentaire de saint Augustin","La liste des 70 psaumes de David"],answer:0,explain:"La Septante (LXX) est la traduction grecque de l’Ancien Testament, faite à Alexandrie."},{q:"Qui est l’auteur de la Vulgate ?",options:["Origène","Jérôme","Augustin","Ambroise"],answer:1,explain:"Saint Jérôme a traduit la Bible en latin à la fin du IVe siècle."}],reflection:"Quel mot d’un verset que je connais bien me semble difficile à traduire ? Que se passerait-il si on le rendait autrement ?"},{id:"genres",level:1,title:"Les genres littéraires",minutes:9,objectives:["Reconnaître les principaux genres bibliques","Expliquer pourquoi le genre commande la lecture"],sections:[{h:"Lire selon le genre",p:["Le concile Vatican II (Dei Verbum 12) demande de tenir compte des « genres littéraires » : on ne lit pas un poème comme un procès-verbal, ni une parabole comme un reportage. Le genre indique ce que le texte veut faire."]},{h:"Principaux genres",p:["Récits (origines, patriarches, histoire d’Israël) · Lois (Ex 20–23, Lévitique, Deutéronome) · Poésie et prière (Psaumes, Cantique) · Sagesse (Proverbes, Qohélet, Job) · Prophétie (oracles et visions : les prophètes parlent d’abord au nom de Dieu à leur temps, ils ne se limitent pas à prédire l’avenir) · Évangiles (genre propre : annonce de foi construite à partir des traditions sur Jésus) · Lettres (occasionnelles, adressées à des communautés précises) · Apocalypses (Daniel, Apocalypse : langage symbolique pour des temps de crise)."]},{h:"Un exemple : Genèse 1",p:["Genèse 1 est un texte structuré, presque liturgique, organisé en sept jours. Il affirme que Dieu est l’unique Créateur et que sa création est « bonne ». Il ne cherche pas à être un traité de cosmologie scientifique : le lire ainsi, c’est lui poser une question qu’il ne pose pas."]}],keyPoints:["Le genre détermine le mode de lecture (DV 12).","Prophète : celui qui parle au nom de Dieu, pas seulement un « prévisionniste ».","Un Évangile est une annonce de foi, pas une biographie au sens moderne."],questions:[{q:"Quel document de Vatican II demande de tenir compte des genres littéraires ?",options:["Lumen gentium","Dei Verbum","Gaudium et spes","Sacrosanctum Concilium"],answer:1,explain:"Dei Verbum, n° 12, sur l’interprétation de l’Écriture."},{q:"Dans la Bible, un « prophète » est avant tout…",options:["Un devin qui prévoit l’avenir","Quelqu’un qui parle au nom de Dieu","Un scribe de la cour","Un prêtre du Temple"],answer:1,explain:"Le prophète transmet la parole de Dieu à une situation donnée ; l’annonce de l’avenir n’en est qu’un aspect."},{q:"Quel genre littéraire est propre au Nouveau Testament ?",options:["La loi","L’Évangile","Le psaume","La généalogie"],answer:1,explain:"L’Évangile est un genre propre : une annonce de foi centrée sur la vie, la mort et la résurrection de Jésus."}],reflection:"Choisissez un passage que vous connaissez : de quel genre est-il ? Qu’est-ce que ce genre change à la façon de le lire ?"},{id:"histoire",level:1,title:"Le contexte historique : des patriarches à Rome",minutes:9,objectives:["Situer les grandes périodes bibliques","Relier un livre à son contexte politique et social"],sections:[{h:"Des origines à la monarchie",p:["Les récits des patriarches (Abraham, Isaac, Jacob) et de l’Exode renvoient à un passé ancien dont la datation est discutée. Vers l’an 1000 av. J.-C., David fait de Jérusalem sa capitale ; son fils Salomon y bâtit le Temple. Après sa mort (vers 931), le royaume se divise : Israël au nord, Juda au sud."]},{h:"Chute et Exil",p:["Samarie tombe devant l’Assyrie en 722–721 av. J.-C. Jérusalem est prise par Babylone et le Temple détruit en 587–586 : c’est l’Exil. En 538, l’édit de Cyrus permet le retour et la reconstruction du Temple (dédié vers 515). Beaucoup de textes bibliques prennent leur forme finale dans ce contexte de crise et de reconstruction."]},{h:"Hellénisme et domination romaine",p:["Après Alexandre le Grand (vers 333 av. J.-C.), l’hellénisme gagne le monde juif. La persécution d’Antiochus IV (167) provoque la révolte des Maccabées. Pompée prend Jérusalem en 63 av. J.-C. : Jésus naît sous l’autorité de Rome. Le Temple est détruit par Titus en 70 apr. J.-C."]}],keyPoints:["Royauté : David (~1000), Salomon, schisme (~931).","Samarie 722/721 ; Jérusalem 587/586 ; retour 538.","Hellénisme (~333), Maccabées (167), Pompée (63), Temple détruit (70)."],questions:[{q:"Quelle période marque la destruction du Temple de Salomon ?",options:["720 av. J.-C.","587–586 av. J.-C.","333 av. J.-C.","70 apr. J.-C."],answer:1,explain:"Jérusalem est prise par Babylone en 587–586 av. J.-C. et le premier Temple est détruit."},{q:"Quel empire domine la Palestine au temps de Jésus ?",options:["L’empire assyrien","L’empire perse","L’empire romain","L’empire babylonien"],answer:2,explain:"Depuis Pompée (63 av. J.-C.), la région est sous domination romaine."},{q:"Quel événement date de 70 apr. J.-C. ?",options:["La révolte des Maccabées","La destruction du Temple par Titus","La conversion de Paul","Le concile de Jérusalem"],answer:1,explain:"Le Temple de Jérusalem est détruit par l’armée romaine de Titus en 70."}],reflection:"Quel livre biblique lisez-vous en ce moment ? À quelle période de l’histoire se rattache-t-il et quelle crise politique ou sociale traverse son peuple ?"},{id:"quatre-sens",level:2,title:"Les quatre sens de l’Écriture",minutes:9,objectives:["Distinguer sens littéral et sens spirituel","Nommer les trois sens spirituels et les illustrer"],sections:[{h:"La tradition des sens de l’Écriture",p:["Le Catéchisme de l’Église catholique (nos 115-119) rappelle l’antique tradition qui distingue deux sens : le sens littéral et le sens spirituel, ce dernier se subdivisant en sens allégorique, moral et anagogique."]},{h:"Le sens littéral",p:["C’est le sens signifié par les paroles de l’Écriture et découvert par l’exégèse (CEC 116). Il est le fondement : selon une formule de Thomas d’Aquin reprise par le Catéchisme, tous les autres sens se fondent sur le sens littéral."]},{h:"Les trois sens spirituels",p:["Sens allégorique : relire un événement à la lumière du Christ (le passage de la mer Rouge est signe de la victoire du Christ et du baptême). Sens moral : ce que le texte appelle à faire (les événements sont écrits « pour notre instruction »). Sens anagogique : ce qui oriente vers la fin, la gloire à venir (l’Église sur terre est signe de la Jérusalem céleste).","Exemple classique de la tradition : « Jérusalem » est la ville de Judée (littéral), l’Église (allégorique), l’âme du fidèle (moral) et la Jérusalem céleste (anagogique)."]}],keyPoints:["Sens littéral = fondement de tous les autres.","Trois sens spirituels : allégorique, moral, anagogique.","Le sens spirituel ne contredit pas le littéral : il le prolonge."],questions:[{q:"Quels sont les trois sens spirituels de l’Écriture ?",options:["Littéral, moral, historique","Allégorique, moral, anagogique","Historique, symbolique, mystique","Typologique, littéral, liturgique"],answer:1,explain:"Le sens spirituel se subdivise en allégorique, moral et anagogique (CEC 117)."},{q:"Que désigne le sens anagogique ?",options:["L’enseignement moral du texte","La lecture orientée vers la réalité ultime, la vie éternelle","Le sens obtenu par comparaison de manuscrits","Le sens que l’auteur humain voulait donner"],answer:1,explain:"Anagogique vient du grec « conduire vers le haut » : il oriente vers la fin dernière."},{q:"Quel sens est le fondement de tous les autres ?",options:["Le sens allégorique","Le sens moral","Le sens anagogique","Le sens littéral"],answer:3,explain:"Tous les autres sens se fondent sur le sens littéral (CEC 116, citant Thomas d’Aquin)."}],reflection:"Prenez un verset et écrivez une phrase pour chacun des quatre sens : que dit le texte ? Que révèle-t-il du Christ ? Que me demande-t-il de faire ? Vers quoi m’oriente-t-il ?"},{id:"historico-critique",level:2,title:"L’exégèse historico-critique",minutes:10,objectives:["Connaître les grandes méthodes de l’exégèse scientifique","Comprendre leur place dans la lecture catholique"],sections:[{h:"Un ensemble de méthodes",p:["Critique textuelle : comparer les manuscrits pour établir le texte le plus proche de l’original. Critique littéraire : repérer les sources, les doublets, les tensions d’un texte. Histoire des formes (Formgeschichte, avec Gunkel, Dibelius, Bultmann) : identifier la forme littéraire d’une unité et son milieu de vie (Sitz im Leben). Histoire de la rédaction (Redaktionsgeschichte) : comprendre comment l’auteur final a organisé et orienté les matériaux reçus."]},{h:"Autres approches",p:["L’analyse narrative étudie l’intrigue, les personnages, le point de vue ; l’analyse rhétorique observe la composition et l’argumentation ; les approches socio-historiques éclairent la société qui a produit le texte."]},{h:"La position de l’Église",p:["Le document de la Commission biblique pontificale « L’interprétation de la Bible dans l’Église » (1993) reconnaît la méthode historico-critique comme indispensable pour l’étude scientifique du sens des textes anciens, tout en soulignant qu’elle ne suffit pas : l’exégèse catholique doit aussi lire le texte comme Parole de Dieu, dans la foi de l’Église."]}],keyPoints:["Plusieurs méthodes complémentaires, pas une seule.","Formgeschichte = forme et milieu de vie ; Redaktionsgeschichte = travail du rédacteur final.","Indispensable mais non suffisante (PBC, 1993)."],questions:[{q:"Que cherche la critique textuelle ?",options:["Les sources écrites d’un livre","Le texte le plus proche de l’original à partir des manuscrits","La structure rhétorique d’un discours","Les citations de l’Ancien Testament dans le Nouveau"],answer:1,explain:"Elle compare les manuscrits et leurs variantes pour établir le texte critique."},{q:"La Formgeschichte étudie…",options:["La vie de l’auteur","Les formes littéraires et leur milieu de vie","Les traductions anciennes","Les manuscrits de Qumrân"],answer:1,explain:"« Histoire des formes » : on identifie le genre d’une petite unité et le contexte (Sitz im Leben) où il a pris naissance."},{q:"Selon la Commission biblique pontificale (1993), la méthode historico-critique est…",options:["Contraire à la foi","Inutile pour la théologie","Indispensable mais insuffisante à elle seule","Réservée aux protestants"],answer:2,explain:"Elle est indispensable pour l’étude scientifique, mais l’exégèse catholique y ajoute la lecture de foi."}],reflection:"Prenez un passage des Évangiles et comparez-le avec son parallèle (par exemple dans Matthieu et Luc). Quelles différences relevez-vous ? Que révèlent-elles de l’intention de chaque auteur ?"},{id:"dei-verbum",level:2,title:"Lire dans l’Église : Dei Verbum 12",minutes:8,objectives:["Énoncer les trois critères de lecture de DV 12","Situer le rôle du Magistère"],sections:[{h:"Un texte de référence",p:["La constitution dogmatique Dei Verbum (Vatican II, 18 novembre 1965) est le grand texte conciliaire sur la Révélation. Son numéro 12 porte sur l’interprétation : il faut chercher ce que les auteurs ont voulu dire (genres littéraires, contexte) et lire l’Écriture dans l’Esprit où elle a été écrite."]},{h:"Trois critères",p:["1. L’unité de toute l’Écriture : chaque texte se lit à la lumière du tout. 2. La Tradition vivante de toute l’Église : la lecture des Pères, de la liturgie, de la foi transmise. 3. L’analogie de la foi : la cohérence des vérités de foi entre elles. Le Catéchisme les reprend (CEC 112-114)."]},{h:"Le rôle du Magistère",p:["Selon Dei Verbum 10, la charge d’interpréter authentiquement la Parole de Dieu est confiée au Magistère vivant de l’Église. Il n’est pas au-dessus de la Parole, il la sert. Le travail des exégètes contribue à préparer ce jugement."]}],keyPoints:["DV 12 : genres littéraires + lecture dans l’Esprit.","Trois critères : unité de l’Écriture, Tradition vivante, analogie de la foi.","Magistère = serviteur de la Parole (DV 10)."],questions:[{q:"Quels sont les trois critères de lecture énoncés par Dei Verbum 12 ?",options:["Histoire, philologie, archéologie","Unité de l’Écriture, Tradition vivante, analogie de la foi","Lecture littérale, morale, mystique","Raison, expérience, autorité"],answer:1,explain:"DV 12 : unité de toute l’Écriture, Tradition vivante de l’Église, analogie de la foi."},{q:"En quelle année Dei Verbum a-t-il été promulgué ?",options:["1943","1962","1965","1993"],answer:2,explain:"Dei Verbum date du 18 novembre 1965."},{q:"À qui revient l’interprétation authentique de la Parole de Dieu selon DV 10 ?",options:["Aux seuls exégètes","Au Magistère vivant de l’Église","À chaque fidèle individuellement","Aux théologiens universitaires"],answer:1,explain:"Cette charge est confiée au Magistère vivant, qui est au service de la Parole."}],reflection:"Quand je lis un verset, ai-je l’habitude de le relier au reste de l’Écriture et à ce que l’Église en dit ? Comment pourrais-je le faire plus concrètement ?"},{id:"typologie",level:2,title:"Typologie et accomplissement",minutes:9,objectives:["Définir type et antitype","Reconnaître plusieurs exemples classiques"],sections:[{h:"Qu’est-ce que la typologie ?",p:["Le « type » (typos) est une figure, une préfiguration dans l’Ancien Testament ; l’« antitype » est la réalité qui l’accomplit dans le Christ. Les auteurs du Nouveau Testament relisent déjà ainsi : Adam est « figure de celui qui devait venir » (Rm 5,14) ; Jésus compare son séjour au tombeau au signe de Jonas (Mt 12,40)."]},{h:"L’unité des deux Testaments",p:["Le Catéchisme (nos 128-130) explique que les chrétiens lisent l’Ancien Testament à la lumière du Christ mort et ressuscité, et il cite l’adage augustinien : le Nouveau est caché dans l’Ancien, et l’Ancien devient manifeste dans le Nouveau (Novum in Vetere latet et in Novo Vetus patet)."]},{h:"Précautions",p:["Une lecture typologique ne supprime pas le sens propre de l’Ancien Testament, qui garde sa valeur de Révélation. Elle ne doit pas non plus devenir un jeu d’associations arbitraires : on cherche des liens que le texte et la Tradition permettent réellement. Consultez l’onglet « Typologie » dans les Repères."]}],keyPoints:["Type = figure de l’AT ; antitype = accomplissement dans le Christ.","Le NT pratique déjà cette lecture (Adam, Jonas, Moïse…).","L’AT garde sa valeur propre ; éviter les associations arbitraires."],questions:[{q:"Quel passage fait de Jonas un signe de la résurrection ?",options:["Matthieu 12,40","Jean 3,14","Hébreux 7,1","1 Corinthiens 10,1"],answer:0,explain:"En Mt 12,40, Jésus compare les trois jours de Jonas dans le poisson à son séjour au tombeau."},{q:"Dans la tradition, Adam est considéré comme un « type » de…",options:["Moïse","David","Jean-Baptiste","Le Christ"],answer:3,explain:"Paul le présente comme « figure de celui qui devait venir » (Rm 5,14)."},{q:"Que veut dire l’adage « Novum in Vetere latet et in Novo Vetus patet » ?",options:["Le Nouveau Testament remplace l’Ancien","Le Nouveau est caché dans l’Ancien et l’Ancien se manifeste dans le Nouveau","L’Ancien Testament est plus ancien que le Nouveau","Le latin est la langue de la Bible"],answer:1,explain:"Formule d’Augustin reprise par le Catéchisme : les deux Testaments s’éclairent mutuellement."}],reflection:"Choisissez une paire de la page « Typologie ». Qu’est-ce que la figure de l’Ancien Testament apprend sur le Christ, et que le Christ révèle-t-il de la figure ?"},{id:"langues-debut",level:2,title:"Lire l’hébreu et le grec : premiers pas",minutes:10,objectives:["Connaître les bases de l’écriture hébraïque et grecque","Comprendre la racine trilitère et les cas grecs"],sections:[{h:"L’hébreu biblique",p:["L’alphabet hébreu compte 22 consonnes et se lit de droite à gauche. Les voyelles, absentes du texte ancien, ont été notées sous forme de points par les Massorètes (lettrés juifs, entre le VIe et le Xe siècle). Beaucoup de mots se rattachent à une racine de trois consonnes (racine trilitère) : par exemple la racine š-m-r évoque l’idée de garder, d’observer."]},{h:"Le grec du Nouveau Testament",p:["Le grec compte 24 lettres et se lit de gauche à droite. Il connaît cinq cas (nominatif, vocatif, accusatif, génitif, datif) : la fonction d’un mot dépend de sa terminaison plus que de sa place. L’article défini (ho, hê, to) est très fréquent. Les accents et esprits ont été ajoutés plus tard."]},{h:"Comment s’entraîner",p:["Apprenez d’abord les alphabets (voir « Cartes mémoire »), puis le vocabulaire fréquent. Ouvrez ensuite l’atelier « Langues anciennes » : chaque mot est donné avec sa translittération, son numéro Strong et son analyse. Commencez par Jean 1,1 et Genèse 1,1."]}],keyPoints:["Hébreu : 22 consonnes, de droite à gauche, voyelles ajoutées par les Massorètes.","Racines trilitères.","Grec : 24 lettres, 5 cas."],questions:[{q:"Combien de lettres compte l’alphabet hébreu ?",options:["22","24","26","27"],answer:0,explain:"22 consonnes, toutes écrites de droite à gauche."},{q:"Dans quel sens se lit l’hébreu ?",options:["De gauche à droite","De droite à gauche","De haut en bas","Dans les deux sens"],answer:1,explain:"L’hébreu se lit de droite à gauche ; c’est pourquoi l’atelier inverse l’ordre d’affichage des mots."},{q:"Combien de cas compte le grec du Nouveau Testament ?",options:["3","4","5","7"],answer:2,explain:"Nominatif, vocatif, accusatif, génitif, datif."},{q:"Qu’est-ce qu’une racine trilitère ?",options:["Un mot de trois lettres au pluriel","Une base de trois consonnes dont dérivent plusieurs mots","Un verset de trois mots","Un nom divin"],answer:1,explain:"La plupart des mots hébreux dérivent d’une racine de trois consonnes."}],reflection:"Essayez de lire à voix haute les premiers mots de Genèse 1,1 et de Jean 1,1 à partir de la translittération. Qu’est-ce qui frappe dans les sons ?"},{id:"ricoeur",level:3,title:"L’herméneutique de Paul Ricœur",minutes:11,objectives:["Expliquer pré-compréhension, soupçon et seconde naïveté","Appliquer ces étapes à un texte biblique"],sections:[{h:"Le texte et son monde",p:["Pour Paul Ricœur (1913-2005), un texte écrit prend de la distance par rapport à son auteur et à ses premiers destinataires : il ouvre un « monde » devant lui, une manière possible d’habiter l’existence. Comprendre un texte, c’est s’approprier cette proposition de monde. L’interprétation n’est donc ni la recherche de l’intention secrète de l’auteur, ni une projection arbitraire du lecteur."]},{h:"Le soupçon",p:["Ricœur appelle Marx, Nietzsche et Freud les « maîtres du soupçon » : ils invitent à se demander ce que le texte et le lecteur peuvent masquer (intérêts sociaux, pouvoir, désirs). Appliqué à la Bible, le soupçon est une purification : il débusque les lectures idéologiques, les instrumentalisations, les illusions du lecteur."]},{h:"La seconde naïveté",p:["Dans La symbolique du mal (1960), Ricœur montre que le symbole « donne à penser ». Après la critique, il devient possible d’une « seconde naïveté » : non un retour à la lecture ingénue, mais une écoute renouvelée, passée par l’épreuve de la critique. L’interprète choisit de croire pour comprendre, et comprend pour croire."]},{h:"Une démarche en trois temps pour MYBIBLE",p:["(1) Pré-compréhension : lire le texte, son genre, son contexte. (2) Soupçon : poser les questions critiques modernes sans les esquiver. (3) Seconde naïveté : recevoir la Parole comme appel qui me concerne ici et maintenant. C’est la structure utilisée dans l’assistant liturgique."]}],keyPoints:["Le texte ouvre un monde devant lui.","Maîtres du soupçon : Marx, Nietzsche, Freud.","Seconde naïveté = écoute renouvelée après la critique."],questions:[{q:"Quels penseurs Ricœur appelle-t-il « maîtres du soupçon » ?",options:["Platon, Aristote, Kant","Marx, Nietzsche, Freud","Hegel, Husserl, Heidegger","Descartes, Pascal, Kierkegaard"],answer:1,explain:"Marx, Nietzsche et Freud, qui invitent à soupçonner les illusions de la conscience."},{q:"Que signifie la « seconde naïveté » ?",options:["Un retour à la lecture ingénue d’avant la critique","Une écoute renouvelée du texte, passée par l’épreuve de la critique","Le refus de toute interprétation","La lecture littérale d’un texte"],answer:1,explain:"Ce n’est pas la naïveté première : c’est une réappropriation après la critique."},{q:"Dans quel ouvrage de 1960 Ricœur affirme-t-il que « le symbole donne à penser » ?",options:["Temps et récit","La symbolique du mal","Soi-même comme un autre","La métaphore vive"],answer:1,explain:"La symbolique du mal (1960) fait du symbole le lieu où la pensée est sollicitée."}],reflection:"Prenez l’Évangile de dimanche : quelle est votre pré-compréhension spontanée ? Quelle question critique n’osez-vous pas poser ? À quoi ce texte vous appelle-t-il, une fois cette question posée ?"},{id:"hegel",level:3,title:"La dialectique hégélienne comme outil de lecture",minutes:10,objectives:["Comprendre thèse, antithèse, synthèse et Aufhebung","Utiliser ce schéma comme aide, sans l’imposer au texte"],sections:[{h:"Le mouvement dialectique",p:["On résume souvent la pensée de Hegel (1770-1831) par la triade thèse–antithèse–synthèse. C’est un raccourci : Hegel parle plutôt d’un mouvement où une position affirmée rencontre sa négation et se trouve dépassée. Le mot clé est Aufhebung : dépasser en conservant, à la fois supprimer, garder et élever."]},{h:"Un usage heuristique en exégèse",p:["Dans la lecture liturgique, on peut utiliser ce mouvement comme aide : la première lecture pose un sens (thèse) ; l’Évangile apporte une rupture, un accomplissement ou un dépassement (antithèse) ; l’unité du dessein de Dieu apparaît dans une synthèse. Exemple : la loi du talion (Ex 21,24) et le « Moi, je vous dis » du Sermon sur la montagne (Mt 5,38-39)."]},{h:"Les limites",p:["La dialectique est un outil, pas une doctrine : le texte biblique doit rester le juge. Le risque est d’imposer un schéma qui ne correspond pas au texte. Il faut aussi tenir fermement que les deux Testaments forment une unité (CEC 128-130) : le Nouveau accomplit l’Ancien sans l’abolir."]}],keyPoints:["Aufhebung = dépasser en conservant.","Usage heuristique : lecture 1 (thèse), Évangile (antithèse), unité (synthèse).","Ne jamais imposer le schéma au texte."],questions:[{q:"Que signifie Aufhebung ?",options:["Détruire ce qui précède","Dépasser en conservant","Répéter à l’identique","Séparer deux idées"],answer:1,explain:"Le terme associe suppression, conservation et élévation."},{q:"Quel est le principal risque d’une application mécanique du schéma dialectique ?",options:["Rendre le texte trop long","Imposer au texte un schéma au lieu de l’écouter","Négliger la grammaire","Utiliser un vocabulaire difficile"],answer:1,explain:"La dialectique est un outil de lecture ; le texte reste le critère."},{q:"Quel couple de passages illustre bien un dépassement dans l’Évangile ?",options:["Ex 21,24 et Mt 5,38-39","Gn 1,1 et Jn 1,1","Ps 22 et Ps 23","Mc 1,1 et Mc 16,8"],answer:0,explain:"Le Sermon sur la montagne reprend la loi du talion pour la dépasser."}],reflection:"Choisissez un couple « AT / NT » de la page Typologie et écrivez en trois phrases : thèse, antithèse, synthèse. Que perdez-vous si vous supprimez l’un des trois termes ?"},{id:"peres",level:3,title:"Les Pères de l’Église et la lecture patristique",minutes:9,objectives:["Connaître quelques grandes figures patristiques","Distinguer les écoles d’Alexandrie et d’Antioche"],sections:[{h:"Qui sont les Pères ?",p:["On appelle Pères de l’Église les grands auteurs chrétiens des premiers siècles dont la doctrine fait autorité : Irénée de Lyon, Origène, Athanase, Basile, Grégoire de Nazianze, Jean Chrysostome, Ambroise, Jérôme, Augustin… Leur lecture de l’Écriture est une source privilégiée de la Tradition."]},{h:"Deux grandes écoles",p:["L’école d’Alexandrie (Clément, Origène) cultive la lecture allégorique et spirituelle : Origène distingue dans l’Écriture le corps, l’âme et l’esprit. L’école d’Antioche (Diodore, Théodore de Mopsueste, Jean Chrysostome) insiste davantage sur le sens littéral et historique. L’équilibre entre les deux inspire la tradition ultérieure."]},{h:"Des phrases qui ont marqué",p:["« L’ignorance des Écritures est l’ignorance du Christ » (Jérôme, repris par Dei Verbum 25). Irénée de Lyon, dans Contre les hérésies, lit l’Écriture dans la cohérence de la foi apostolique contre les gnostiques. Augustin développe la lecture typologique et la distinction entre « lettre » et « esprit »."]}],keyPoints:["Alexandrie : allégorie (Origène) ; Antioche : littéral et historique.","Jérôme : « ignorer les Écritures, c’est ignorer le Christ ».","La patristique est une source de la Tradition vivante."],questions:[{q:"Qui a écrit « L’ignorance des Écritures est l’ignorance du Christ » ?",options:["Augustin","Jérôme","Ambroise","Origène"],answer:1,explain:"Formule de saint Jérôme, citée dans Dei Verbum 25."},{q:"Quelle école privilégie la lecture allégorique ?",options:["Antioche","Alexandrie","Rome","Carthage"],answer:1,explain:"L’école d’Alexandrie, avec Clément et surtout Origène."},{q:"Contre qui Irénée de Lyon écrit-il son œuvre principale ?",options:["Les ariens","Les gnostiques","Les pélagiens","Les donatistes"],answer:1,explain:"Contre les hérésies (Adversus haereses) combat le gnosticisme."}],reflection:"Lisez un court commentaire patristique sur l’Évangile du jour. Qu’est-ce qui vous surprend ? Quelle image ou quel symbole la lecture patristique met-elle en lumière ?"},{id:"lectio",level:3,title:"La lectio divina",minutes:8,objectives:["Connaître les étapes de la lectio divina","La pratiquer avec l’outil guidé de MYBIBLE"],sections:[{h:"Une lecture priée",p:["La lectio divina est une manière ancienne de lire l’Écriture comme Parole adressée à soi, en vue de la rencontre avec Dieu. Elle a été formalisée au XIIe siècle par le chartreux Guigues II dans L’échelle des moines. Benoît XVI la recommande dans l’exhortation Verbum Domini (nos 86-87)."]},{h:"Les étapes",p:["Lectio : lire lentement et attentivement le texte, observer. Meditatio : méditer, relier, se demander « que dit ce texte ? ». Oratio : répondre à Dieu par la prière (louange, demande, action de grâce). Contemplatio : se tenir dans le silence devant Dieu. À cela, la tradition ajoute souvent l’actio : une décision concrète pour la vie."]},{h:"Conseils pratiques",p:["Choisissez un passage court (l’Évangile du jour est idéal). Lisez-le deux ou trois fois, à voix haute si possible. Notez un mot ou une phrase qui vous arrête. Terminez par une décision simple. L’outil « Lectio divina » de MYBIBLE vous guide pas à pas et garde une trace de vos méditations."]}],keyPoints:["Lectio, meditatio, oratio, contemplatio (+ actio).","Formalisée par Guigues II (XIIe s.).","Passage court, lecture lente, décision concrète."],questions:[{q:"Quel est l’ordre classique des étapes de la lectio divina ?",options:["Oratio, lectio, meditatio, contemplatio","Lectio, meditatio, oratio, contemplatio","Meditatio, lectio, contemplatio, oratio","Contemplatio, oratio, lectio, meditatio"],answer:1,explain:"Lire, méditer, prier, contempler."},{q:"Que désigne la lectio ?",options:["La prière de louange","La lecture attentive du texte","Le silence contemplatif","La décision concrète"],answer:1,explain:"Lectio = lecture lente et observation attentive du texte."},{q:"Qui a formalisé les quatre étapes au XIIe siècle ?",options:["Benoît de Nursie","Guigues II le Chartreux","Thomas d’Aquin","Ignace de Loyola"],answer:1,explain:"Guigues II, dans L’échelle des moines."}],reflection:"Pratiquez maintenant une lectio sur l’Évangile du jour avec l’outil guidé, puis revenez comparer cette expérience avec l’analyse savante du même passage."},{id:"homelie",level:3,title:"Préparer une homélie à partir des lectures",minutes:10,objectives:["Suivre une méthode de préparation","Articuler exégèse, Tradition, vie et mission"],sections:[{h:"Une partie de la liturgie",p:["Sacrosanctum Concilium (n° 52) affirme que l’homélie fait partie de la liturgie elle-même : elle n’est pas une conférence indépendante, mais le moment où la Parole proclamée est actualisée pour l’assemblée. Le pape François y consacre un long développement dans Evangelii gaudium (nos 135-159)."]},{h:"Une méthode en cinq temps",p:["1. Lire ensemble toutes les lectures (première lecture, psaume, deuxième lecture, Évangile) et repérer leurs liens. 2. Observer le contexte et le genre de chaque texte. 3. Dégager l’idée centrale de l’Évangile (sa « quintessence »). 4. L’éclairer par la Tradition (Pères, Magistère) et par ce que l’Église célèbre ce jour-là. 5. L’appliquer : que change cette Parole dans la vie des personnes et dans la mission d’évangélisation aujourd’hui ?"]},{h:"Utiliser l’assistant liturgique",p:["L’assistant génère une proposition structurée (dialectique, Ricœur, Tradition, application). Elle reste une aide : elle doit être relue, vérifiée (références patristiques et du Catéchisme) et personnalisée. L’homélie est un acte pastoral qui n’est pas délégué à un outil."]}],keyPoints:["L’homélie fait partie de la liturgie (SC 52).","Lire toutes les lectures ensemble.","Quintessence → Tradition → application.","L’IA propose, le prédicateur discerne."],questions:[{q:"Que dit Sacrosanctum Concilium 52 de l’homélie ?",options:["Elle est facultative","Elle fait partie de la liturgie elle-même","Elle peut remplacer l’Évangile","Elle est réservée aux évêques"],answer:1,explain:"L’homélie est « partie de la liturgie » : elle actualise la Parole proclamée."},{q:"Quelle est la première étape de la préparation ?",options:["Écrire le texte final","Lire ensemble toutes les lectures du jour","Chercher une histoire drôle","Consulter un commentaire sur un seul verset"],answer:1,explain:"On commence par lire les lectures ensemble pour repérer leurs liens."},{q:"Comment considérer une proposition générée par l’IA ?",options:["Comme le texte définitif","Comme une aide à relire, vérifier et personnaliser","Comme un texte du Magistère","Comme inutile"],answer:1,explain:"L’outil aide ; le prédicateur reste responsable de la vérification et de la prédication."}],reflection:"Préparez, en cinq lignes, le fil conducteur d’une homélie sur l’Évangile de dimanche prochain : idée centrale, lien avec la première lecture, écho patristique, application concrète."}];var i1=[{id:"alpha-grec",name:"Alphabet grec",desc:"Les 24 lettres : nom et son.",script:"greek"},{id:"alpha-hebreu",name:"Alphabet hébreu",desc:"Les 22 lettres : nom et son.",script:"hebrew"},{id:"vocab-grec",name:"Vocabulaire grec du NT",desc:"Mots fréquents et théologiques, avec numéro Strong.",script:"greek"},{id:"vocab-hebreu",name:"Vocabulaire hébreu de l’AT",desc:"Mots fréquents et théologiques, avec numéro Strong.",script:"hebrew"},{id:"termes",name:"Termes théologiques",desc:"Définitions des grands mots de la tradition."}],ft=(t,e,a,r)=>({id:"ag-"+t,deck:"alpha-grec",front:e,back:a,detail:r,script:"greek"}),Ct=(t,e,a,r)=>({id:"ah-"+t,deck:"alpha-hebreu",front:e,back:a,detail:r,script:"hebrew"}),vt=(t,e,a,r)=>({id:"vg-"+t,deck:"vocab-grec",front:e,back:a,detail:r,script:"greek"}),kt=(t,e,a,r)=>({id:"vh-"+t,deck:"vocab-hebreu",front:e,back:a,detail:r,script:"hebrew"}),jl=[ft("alpha","Α α","alpha","a"),ft("beta","Β β","bêta","b"),ft("gamma","Γ γ","gamma","g (dur) ; « n » devant γ, κ, ξ, χ"),ft("delta","Δ δ","delta","d"),ft("epsilon","Ε ε","epsilon","e bref"),ft("zeta","Ζ ζ","zêta","dz"),ft("eta","Η η","êta","ê long"),ft("theta","Θ θ","thêta","th"),ft("iota","Ι ι","iota","i"),ft("kappa","Κ κ","kappa","k"),ft("lambda","Λ λ","lambda","l"),ft("mu","Μ μ","mu","m"),ft("nu","Ν ν","nu","n"),ft("xi","Ξ ξ","xi","ks"),ft("omicron","Ο ο","omicron","o bref"),ft("pi","Π π","pi","p"),ft("rho","Ρ ρ","rhô","r"),ft("sigma","Σ σ ς érise l’amour de Dieu dans le Nouveau Testament.","Rare dans le grec profane, employé dans la LXX, puis central chez Jean et Paul (Jn 3,16 ; 1 Co 13 ; 1 Jn 4,8)."],["Logos","λόγος","grec","Parole, discours, raison ordonnatrice. Dans le prologue de Jean, la Parole éternelle de Dieu qui se fait chair.","Philosophie grecque (Héraclite, stoïciens) et littérature de Sagesse (Pr 8) ; Jn 1,1-18 ; apologistes et Pères (Justin, Origène, Athanase)."],["Berith (alliance)","בְּרִית","hébreu","Alliance : engagement solennel qui lie Dieu et son peuple (Noé, Abraham, Sinaï, David), jusqu’à la « nouvelle alliance » (Jr 31).","Traités d’alliance du Proche-Orient ancien → théologie de l’alliance dans l’AT → nouvelle alliance dans le sang du Christ (Lc 22,20)."],["Kénose","κένωσις","grec","Abaissement volontaire du Christ qui « s’est vidé » de lui-même en prenant la condition de serviteur (Ph 2,6-11).","Hymne de Ph 2 → Pères (Cyrille d’Alexandrie) → christologie moderne et débats sur la souffrance de Dieu."],["Rûah (esprit)","רוּחַ","hébreu","Souffle, vent, esprit : la force vitale de Dieu qui crée (Gn 1,2), inspire les prophètes et renouvelle les cœurs (Ez 37).","AT : rûah YHWH → NT : pneuma hagion → pneumatologie patristique et conciliaire."],["Grâce","χάρις","grec","Faveur gratuite de Dieu, don qu’aucun mérite ne précède ; en hébreu, « trouver grâce » (hen) aux yeux de quelqu’un.","Hen (AT) → charis (LXX, NT, surtout Paul : Rm 3,24 ; Ep 2,8) → débat augustinien sur la grâce → CEC 1996-2005."],["Foi","πίστις","grec","Confiance fidèle en Dieu et adhésion à sa Parole ; l’hébreu emunah évoque la solidité, la fidélité.","Emunah (Ha 2,4 : le juste vivra par sa fidélité) → pistis (Rm 1,17 ; He 11,1) → fides quaerens intellectum (Anselme)."],["Justice","צְדָקָה","hébreu","Conformité à la relation d’alliance : être droit envers Dieu et envers les autres ; la « justice de Dieu » est aussi son action qui sauve.","Tsedaqah (AT) → dikaiosynè (Mt 5,6 ; Rm 1,17) → justification par la foi et débats sur la grâce et les œuvres."],["Péché","ἁμαρτία","grec","Rupture de la relation avec Dieu. Le grec hamartia évoque « manquer la cible » ; l’hébreu a plusieurs mots : het (manquer), pesha (révolte), avon (faute, iniquité).","Gn 3 ; Ps 51 → Rm 5,12 → péché originel et péchés personnels dans la tradition."],["Rédemption","ἀπολύτρωσις","grec","Rachat, libération. En hébreu, le go’el est le proche qui rachète un parent esclave ou sa terre ; Dieu est le go’el d’Israël.","Go’el (Rt ; Ex 6,6 ; Is 43) → apolutrôsis (Ep 1,7 ; Rm 3,24) → théologie de la rédemption."],["Royaume de Dieu","βασιλεία τοῦ θεοῦ","grec","Règne de Dieu, déjà inauguré dans la personne et l’action de Jésus et à accomplir pleinement à la fin des temps (« déjà » et « pas encore »).","Royauté de YHWH (Ps 93 ; 96) → prédication de Jésus (Mc 1,15) → Église, signe et germe du Royaume."],["Évangile","εὐαγγέλιον","grec","Bonne nouvelle. Chez Is 52,7, le messager qui annonce la paix ; dans le Nouveau Testament, l’annonce de Jésus Christ mort et ressuscité.","Besorah (Is 52,7 ; 61,1) → euangelion (Mc 1,1 ; Rm 1,16) → genre littéraire des quatre Évangiles."],["Église","ἐκκλησία","grec","Assemblée « convoquée » ; en grec biblique, traduit l’hébreu qahal, l’assemblée du peuple de Dieu.","Qahal (Dt 4,10) → ekklêsia (Mt 16,18 ; Ac 2) → Corps du Christ et peuple de Dieu (Lumen gentium)."],["Messie / Christ","מָשִׁיחַ","hébreu","« Oint ». Rois, prêtres et prophètes étaient oints d’huile ; Jésus est reconnu comme le Messie (en grec Christos).","Mashiach (1 S 16 ; Ps 2 ; Dn 9) → christos (Mc 8,29 ; Ac 2,36) → christologie."],["Shalom (paix)","שָׁלוֹם","hébreu","Paix comme plénitude, intégrité, bien-être de la personne et de la communauté, pas seulement l’absence de guerre.","Nb 6,26 → Is 9,5 → Jn 14,27 ; 20,19 → salutation liturgique « La paix soit avec vous »."],["Torah","תּוֹרָה","hébreu","Enseignement, instruction : le mot est plus large que « loi ». Désigne aussi les cinq premiers livres (Pentateuque).","Torah (Ps 1 ; 119) → nomos (LXX, Paul) → débats sur la Loi et l’Évangile ; Mt 5,17."],["Parole","דָּבָר","hébreu","Dabar signifie à la fois « parole » et « chose, événement » : la parole de Dieu agit ce qu’elle dit.","Gn 1 ; Is 55,10-11 → Logos de Jn 1 → Verbum Domini (2010) : la Parole de Dieu dans la vie de l’Église."],["Sagesse","חָכְמָה","hébreu","Art de vivre selon l’ordre voulu par Dieu ; personnifiée comme compagne de Dieu dans la création (Pr 8).","Hokmah (Pr 8 ; Si 24) → sophia (Sg 7) → « Christ, sagesse de Dieu » (1 Co 1,24)."],["Sainteté","קָדוֹשׁ","hébreu","« Mis à part » : ce qui appartient à Dieu. La sainteté de Dieu est d’abord son altérité, que l’on partage en vivant de lui.","Lv 19,2 ; Is 6,3 → hagios (1 P 1,16) → vocation universelle à la sainteté (Lumen gentium, ch. V)."],["Gloire","כָּבוֹד","hébreu","Kavod vient d’une racine qui dit le « poids », l’importance : la gloire est la manifestation rayonnante de la présence de Dieu.","Ex 24,16 ; 1 R 8,11 → doxa (Jn 1,14 ; 17,5) → doxologie dans la liturgie."],["Résurrection","ἀνάστασις","grec","Relèvement d’entre les morts : la vie nouvelle donnée par Dieu. Le Christ est « premier-né d’entre les morts ».","Is 26,19 ; Dn 12,2 ; 2 M 7 → anastasis (Mc 16 ; 1 Co 15) → Credo."],["Incarnation","σὰρξ ἐγένετο","grec","Le Verbe « s’est fait chair » (Jn 1,14) : Dieu prend la condition humaine en Jésus de Nazareth.","Jn 1,14 → Chalcédoine (451) : vrai Dieu et vrai homme → théologie de l’Incarnation."],["Pâque","פֶּסַח","hébreu","Fête du « passage » : mémorial de la libération d’Égypte, accomplie dans la mort et la résurrection du Christ.","Ex 12 → Dt 16 → Jn 19 ; 1 Co 5,7 → Vigile pascale."],["Sabbat","שַׁבָּת","hébreu","Jour du repos, d’un verbe qui signifie « cesser » : signe de l’alliance et mémoire de la création et de la libération.","Gn 2,2-3 ; Ex 20,8-11 ; Dt 5,12-15 → Mc 2,27 → dimanche, jour du Seigneur."],["Prophète","נָבִיא","hébreu","Celui qui parle au nom de Dieu à son peuple : le grec prophêtês signifie « celui qui parle pour (un autre) ». Annoncer l’avenir n’en est qu’un aspect.","Dt 18,15 ; Am 7,15 → Mt 5,12 ; Lc 4,24 → ministère prophétique du peuple de Dieu."],["Eucharistie","εὐχαριστία","grec","Action de grâces : nom donné à la célébration où l’Église fait mémoire du don du Christ.","Lc 22,19 ; 1 Co 11,23-26 → Didachè → liturgie eucharistique."],["Parousie","παρουσία","grec","Présence, venue, arrivée : désigne le retour glorieux du Christ à la fin des temps.","Mt 24,3 ; 1 Th 4,15 → Credo (« Il reviendra dans la gloire »)."],["Tradition","παράδοσις","grec","Transmission : ce qui est reçu et livré de génération en génération, d’abord la Parole vivante des apôtres.","1 Co 11,23 ; 15,3 → Pères → Dei Verbum 8-10."]],ka=pv.map((t,e)=>({id:e+1,term:t[0],original_term:t[1],language:t[2],definition:t[3],semantic_path:t[4]}));var Hl=V(Lt()),n1={};function Ve(t,e){try{let a=localStorage.getItem(t);if(a)return JSON.parse(a)}catch{}return t in n1?JSON.parse(n1[t]):e}function yr(t,e){let a=JSON.stringify(e);n1[t]=a;try{localStorage.setItem(t,a)}catch{}}function We(t,e){let[a,r]=(0,Hl.useState)(()=>Ve(t,e));return(0,Hl.useEffect)(()=>{yr(t,a)},[t,a]),[a,r]}var Qe=(t=new Date)=>{let e=String(t.getMonth()+1).padStart(2,"0"),a=String(t.getDate()).padStart(2,"0");return`${t.getFullYear()}-${e}-${a}`},Nl=(t,e)=>{let[a,r,i]=t.split("-").map(Number);return Qe(new Date(a,r-1,i+e))},qn=t=>{let e=[...t];for(let a=e.length-1;a>0;a--){let r=Math.floor(Math.random()*(a+1));[e[a],e[r]]=[e[r],e[a]]}return e};var St={progress:"mybible_progress",cards:"mybible_cards",notes:"mybible_notes",lectio:"mybible_lectio"},Ye={lessons:{},quizPlayed:0,quizCorrect:0,quizAsked:0,days:[]},xa=t=>{let e=Qe();return t.days.includes(e)?t:{...t,days:[...t.days,e].slice(-400)}},bg=t=>{let e=new Set(t),a=Qe();e.has(a)||(a=Nl(a,-1));let r=0;for(;e.has(a);)r+=1,a=Nl(a,-1);return r},fv=[0,1,3,7,16,35],Bg=(t,e)=>{let a=Qe();if(!e)return{box:1,due:a};let r=Math.min(5,(t?.box??0)+1);return{box:r,due:Nl(a,fv[r])}},zn=t=>!t||t
